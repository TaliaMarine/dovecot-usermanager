apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dovecot-usermanager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dovecot-usermanager.labels" . | nindent 4 }}
rules:
  # create cannot be limited by resourceNames; the app only uses it to
  # create the users Secret when it does not exist yet.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.dovecot.usersSecretName | quote }}]
    verbs: ["get", "update"]
  # "rollout restart" of Dovecot only.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ .Values.dovecot.deploymentName | quote }}]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dovecot-usermanager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dovecot-usermanager.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dovecot-usermanager.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "dovecot-usermanager.fullname" . }}
    namespace: {{ .Release.Namespace }}
