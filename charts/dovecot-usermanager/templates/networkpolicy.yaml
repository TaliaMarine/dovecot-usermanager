{{- if .Values.networkPolicy.enabled }}
{{- /* Starting point: ingress to 8080, egress to DNS and HTTPS/API server (OIDC discovery + Kubernetes API). */ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dovecot-usermanager.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dovecot-usermanager.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dovecot-usermanager.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
{{- end }}
