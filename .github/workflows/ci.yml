name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache-dependency-path: go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: gofmt -l . | tee /tmp/gofmt.out && test ! -s /tmp/gofmt.out
      - run: go test ./... -race

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - run: helm lint charts/dovecot-usermanager --set oidc.issuerUrl=https://idp.example.com/ --set oidc.clientId=x --set oidc.redirectUrl=https://um.example.com/api/auth/callback --set sessionKey.secretRef.name=sk --set ingress.host=um.example.com
      - name: Render every ingress mode
        run: |
          args="--set oidc.issuerUrl=https://idp.example.com/ --set oidc.clientId=x --set oidc.redirectUrl=https://um.example.com/api/auth/callback --set sessionKey.secretRef.name=sk"
          helm template charts/dovecot-usermanager $args --set ingress.type=none
          helm template charts/dovecot-usermanager $args --set ingress.type=gateway-api --set ingress.host=um.example.com
          helm template charts/dovecot-usermanager $args --set ingress.host=um.example.com --set networkPolicy.enabled=true
      - name: Chart refuses to render without required values
        run: |
          if helm template charts/dovecot-usermanager >/dev/null 2>&1; then
            echo "::error::chart rendered without oidc/sessionKey values"; exit 1
          fi

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
